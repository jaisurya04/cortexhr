# Scheduled drift + fairness monitor. GitHub only runs workflows from <repo root>/.github/workflows/, so COPY this file to
#   .github/workflows/cortexhr-monitor.yml
# (a new file outside phase4/ - it needs your approval). Then Actions > "CortexHR monitor" > Run workflow once and screenshot the run.
name: CortexHR monitor
on:
  schedule:
    - cron: "30 3 * * 1"      # every Monday 03:30 UTC (09:00 IST)
  workflow_dispatch: {}
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phase4/requirements.txt
      - run: pip install -r phase4/requirements.txt
      - name: Run monitor (exit 0 OK, 1 WATCH, 2 ALERT)
        run: python phase4/scripts/monitor.py
        continue-on-error: true
        id: mon
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: phase4/outputs/monitoring/
      - name: Fail the job on ALERT so the owner is notified
        if: steps.mon.outcome == 'failure'
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("phase4/outputs/monitoring/monitoring_latest.json"))["status"]
          print("status:", s)
          sys.exit(2 if s == "ALERT" else 0)
          PY
